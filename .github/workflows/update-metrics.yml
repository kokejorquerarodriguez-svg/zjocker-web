name: Update Z Jocker Metrics
on:
  schedule:
      - cron: '0 13 * * *'
          - cron: '0 21 * * *'
            workflow_dispatch:

            jobs:
              update-metrics:
                  runs-on: ubuntu-latest

                          steps:
                                - name: Checkout codigo
                                        uses: actions/checkout@v3

                                                    - name: Configurar Python
                                                            uses: actions/setup-python@v4
                                                                    with:
                                                                              python-version: '3.9'

                                                                                          - name: Instalar dependencias
                                                                                                  run: |
                                                                                                            python -m pip install --upgrade pip
                                                                                                                      pip install requests python-dotenv
                                                                                                                            
                                                                                                                                  - name: Crear archivo .env
                                                                                                                                          run: |
                                                                                                                                                    cd zjocker-automation
                                                                                                                                                              cat > .env << EOF
                                                                                                                                                                        YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
                                                                                                                                                                                  EOF
                                                                                                                                                                                        
                                                                                                                                                                                              - name: Copiar index.html
                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                cp index.html zjocker-automation/
                                                                                                                                                                                                                      
                                                                                                                                                                                                                            - name: Actualizar metricas
                                                                                                                                                                                                                                    run: |
                                                                                                                                                                                                                                              cd zjocker-automation
                                                                                                                                                                                                                                                        cat > data.json << 'JSONEOF'
                                                                                                                                                                                                                                                                  {"monthly_listeners":"662K","youtube_subs":"163K","video_count":"69","total_views":"193,566,533"}
                                                                                                                                                                                                                                                                            JSONEOF
                                                                                                                                                                                                                                                                                      python3 scripts/update_metrics.py || true
                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                  - name: Copiar index.html actualizado
                                                                                                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                                                                                                    cp zjocker-automation/index.html .
                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                - name: Commit cambios
                                                                                                                                                                                                                                                                                                                                        run: |
                                                                                                                                                                                                                                                                                                                                                  git config --global user.email "zjocker-bot@github.com"
                                                                                                                                                                                                                                                                                                                                                            git config --global user.name "Z Jocker Bot"
                                                                                                                                                                                                                                                                                                                                                                      git add -A
                                                                                                                                                                                                                                                                                                                                                                                git diff --quiet && git diff --staged --quiet || (git commit -m "🎵 Actualizar metricas" && git push)
